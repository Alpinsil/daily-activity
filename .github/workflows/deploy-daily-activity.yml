name: Deploy Daily Activity to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "daily_activity/**"
      - ".github/workflows/deploy-daily-activity.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-activity-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp daily_activity/index.html daily_activity/styles.css daily_activity/app.js daily_activity/config.js daily_activity/manifest.webmanifest daily_activity/service-worker.js daily_activity/icon.svg _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
